name: Build Report

on:
  push:
    paths:
      - 'report/**'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: report_dataliteracy.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: report/report_dataliteracy.pdf
     
      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add report/report_dataliteracy.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Auto-build paper PDF"
            git push
          fi
